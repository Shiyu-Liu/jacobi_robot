controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
  
joint_trajectory_controller:
  ros__parameters:
    joints:
      - linear_axis_joint_1
      - abb_arm_joint_1
      - abb_arm_joint_2
      - abb_arm_joint_3
      - abb_arm_joint_4
      - abb_arm_joint_5
      - abb_arm_joint_6
    interface_name: position
    command_interface:
      - position
    state_interface:
      - position
      - velocity